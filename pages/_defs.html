<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>
  <filter id="graffiti" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="n1"/>
    <feDisplacementMap in="SourceGraphic" in2="n1" scale="7"
      xChannelSelector="R" yChannelSelector="G" result="rough"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="5" result="n2"/>
    <feColorMatrix in="n2" type="luminanceToAlpha" result="grainA"/>
    <feComponentTransfer in="grainA" result="grainB">
      <feFuncA type="linear" slope="1.9" intercept="-0.25"/>
    </feComponentTransfer>
    <feComposite in="rough" in2="grainB" operator="in"/>
  </filter>
  <filter id="suaraGrain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".54" numOctaves="3" seed="27" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.8" intercept="-.25"/>
      <feFuncG type="linear" slope="1.8" intercept="-.25"/>
      <feFuncB type="linear" slope="1.8" intercept="-.25"/>
      <feFuncA type="table" tableValues="0 .52"/>
    </feComponentTransfer>
  </filter>
</defs></svg>
